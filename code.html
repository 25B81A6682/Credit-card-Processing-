<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Payment</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .payment-box {
            background: white;
            width: 380px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: #222;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .row div {
            flex: 1;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
        }

        .notice {
            font-size: 12px;
            color: #666;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="payment-box">
    <h2>Credit Card Payment</h2>

    <form id="paymentForm">

        <label for="name">Cardholder Name</label>
        <input
            type="text"
            id="name"
            placeholder="John Doe"
            required
        >

        <label for="cardNumber">Card Number</label>
        <input
            type="text"
            id="cardNumber"
            placeholder="1234 5678 9012 3456"
            maxlength="19"
            inputmode="numeric"
            required
        >

        <div class="row">
            <div>
                <label for="expiry">Expiry Date</label>
                <input
                    type="text"
                    id="expiry"
                    placeholder="MM/YY"
                    maxlength="5"
                    required
                >
            </div>

            <div>
                <label for="cvv">CVV</label>
                <input
                    type="password"
                    id="cvv"
                    placeholder="123"
                    maxlength="4"
                    inputmode="numeric"
                    required
                >
            </div>
        </div>

        <label for="amount">Amount</label>
        <input
            type="number"
            id="amount"
            placeholder="100.00"
            min="0.01"
            step="0.01"
            required
        >

        <button type="submit">Process Payment</button>

        <p id="message"></p>

        <p class="notice">
            Demo only — no real payment is processed.
        </p>
    </form>
</div>

<script>
    const form = document.getElementById("paymentForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const cardNumber = document.getElementById("cardNumber").value
            .replace(/\s/g, "");
        const expiry = document.getElementById("expiry").value.trim();
        const cvv = document.getElementById("cvv").value.trim();
        const amount = document.getElementById("amount").value;

        if (name === "") {
            showMessage("Please enter the cardholder name.", "red");
            return;
        }

        if (!/^\d{13,19}$/.test(cardNumber)) {
            showMessage("Please enter a valid card number.", "red");
            return;
        }

        if (!/^(0[1-9]|1[0-2])\/\d{2}$/.test(expiry)) {
            showMessage("Enter expiry date as MM/YY.", "red");
            return;
        }

        if (!/^\d{3,4}$/.test(cvv)) {
            showMessage("Please enter a valid CVV.", "red");
            return;
        }

        if (Number(amount) <= 0) {
            showMessage("Enter a valid payment amount.", "red");
            return;
        }

        showMessage(
            "Demo payment validated successfully!",
            "green"
        );
    });

    function showMessage(text, color) {
        message.textContent = text;
        message.style.color = color;
    }
</script>

</body>
</html>
